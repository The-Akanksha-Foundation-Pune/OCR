<nav class="topnav">
  <div class="topnav-inner">
    <a class="topnav-brand" href="{{ url_for('ocr.index') }}">
      <span class="topnav-brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8 10.5h8M8 14h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
      Akanksha Form OCR
    </a>
    <div class="topnav-links">
      <a
        href="{{ url_for('ocr.index') }}"
        class="topnav-link{{ ' active' if active_page == 'scanner' else '' }}"
      >Scanner</a>
      <a
        href="{{ url_for('history.history_page') }}"
        class="topnav-link{{ ' active' if active_page == 'history' else '' }}"
      >History</a>
    </div>
    {% if current_user %}
    <div class="topnav-user">
      {% if current_user.picture %}
        <img class="topnav-avatar" src="{{ current_user.picture }}" alt="" referrerpolicy="no-referrer" />
      {% else %}
        <span class="topnav-avatar topnav-avatar-fallback" aria-hidden="true">{{ current_user.name[:1]|upper }}</span>
      {% endif %}
      <span class="topnav-user-name">{{ current_user.name }}</span>
      <a class="topnav-logout" href="{{ url_for('auth.logout') }}">Sign out</a>
    </div>
    {% endif %}
  </div>
</nav>
